syntax = "proto3";

package nucleus.client.printer.print.v1;

import "nucleus/client/printer/print/v1/print_messages.proto";

option java_multiple_files = true;
option java_package = "com.zebra.proto.nucleus.client.printer.print.v1";

service PrintService {
  rpc Print(PrintRequest) returns (stream PrintResponse) {}
  rpc GetPrintJobStatus(GetPrintJobStatusRequest) returns (GetPrintJobStatusResponse) {}
  rpc CancelPrintJob(CancelPrintJobRequest) returns (CancelPrintJobResponse) {}
}
